# Workflow d'extraction automatique des données
#
# Ce workflow s'exécute tous les jours à 22h UTC (minuit Paris en hiver, 00h en été)
# après la clôture de la bourse NYSE (16h30 EST = 21h30 UTC).
#
# MODE INCRÉMENTAL (par défaut):
# - Ne télécharge que les données depuis la dernière date en DB (~5-10 jours)
# - Beaucoup plus rapide que le full reload (~30s vs ~5min)
#
# MODE FULL RELOAD (manuel avec full_reload=true):
# - Recharge toutes les données depuis 2010
# - À utiliser si les données sont corrompues ou pour réinitialiser
#
# Les modèles ML utilisent automatiquement les nouvelles données via le TTL cache (6h).

name: Data Refresh

on:
  schedule:
    # Tous les jours à 22h UTC (après clôture NYSE)
    # Cron: minute heure jour mois jour-semaine
    - cron: '0 22 * * 1-5'  # Lun-Ven seulement (pas de données weekend)

  workflow_dispatch:  # Permet de lancer manuellement
    inputs:
      full_reload:
        description: 'Recharger toutes les données (2010-aujourd''hui)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'

# Permissions nécessaires pour push et créer des issues
permissions:
  contents: write    # Pour push les backtest results
  issues: write      # Pour créer des issues en cas d'échec

jobs:
  extract-data:
    name: Extract & Load Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance fredapi python-dotenv sqlalchemy psycopg2-binary

      - name: Extract ETF prices (yfinance)
        run: |
          echo "📈 Extraction des prix ETF depuis Yahoo Finance..."
          python -m data.extractors.extract_yfinance
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Mode incrémental sauf si full_reload demandé
          INCREMENTAL: ${{ github.event.inputs.full_reload != 'true' && 'true' || 'false' }}

      - name: Extract macro data (FRED)
        run: |
          echo "📊 Extraction des indicateurs macro depuis FRED..."
          python -m data.extractors.extract_fred
        env:
          PYTHONPATH: ${{ github.workspace }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          INCREMENTAL: ${{ github.event.inputs.full_reload != 'true' && 'true' || 'false' }}

      - name: Run aggregation pipeline
        run: |
          echo "🔧 Agrégation et calcul des features..."
          python -m data.pipeline.aggregate
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          INCREMENTAL: ${{ github.event.inputs.full_reload != 'true' && 'true' || 'false' }}

      - name: Load to Supabase
        run: |
          echo "☁️ Chargement vers Supabase..."
          python -m data.pipeline.load_to_db
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Verify data freshness
        run: |
          echo "✅ Vérification des données..."
          python -c "
          import os
          from datetime import datetime
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ['SUPABASE_DB_URL'])
          with engine.connect() as conn:
              # Dernière date de prix
              result = conn.execute(text('SELECT MAX(date) FROM price'))
              latest_price = result.scalar()

              # Dernière date macro
              result = conn.execute(text('SELECT MAX(date) FROM macro_indicator'))
              latest_macro = result.scalar()

              # Comptages
              result = conn.execute(text('SELECT COUNT(*) FROM price'))
              price_count = result.scalar()

              result = conn.execute(text('SELECT COUNT(*) FROM macro_indicator'))
              macro_count = result.scalar()

          print(f'📅 Derniers prix: {latest_price}')
          print(f'📅 Dernière macro: {latest_macro}')
          print(f'📊 Total prix: {price_count} lignes')
          print(f'📊 Total macro: {macro_count} lignes')

          # Alerte si données pas fraîches
          today = datetime.now().date()
          if latest_price and (today - latest_price).days > 3:
              print(f'⚠️ ATTENTION: Données prix datent de {(today - latest_price).days} jours')
          "
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Summary
        run: |
          echo "## 🚀 Data Refresh Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Les modèles ML utiliseront automatiquement ces nouvelles données" >> $GITHUB_STEP_SUMMARY
          echo "lors de leur prochain retraining (TTL cache 6h)." >> $GITHUB_STEP_SUMMARY

  # Job quotidien pour régénérer les résultats du backtest DeepPilot
  # Tourne après extract-data pour avoir les dernières données SPY, QQQ, etc.
  regenerate-backtest:
    name: Regenerate Backtest Results
    runs-on: ubuntu-latest
    needs: extract-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        run: |
          echo "🤖 Régénération du backtest DeepPilot..."
          python scripts/run_backtest.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

      - name: Commit and push backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backtest_results.json
          git diff --staged --quiet || git commit -m "chore: update backtest results [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🤖 Backtest Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "Les résultats du backtest DeepPilot ont été recalculés avec les dernières données." >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [extract-data, regenerate-backtest]
    if: failure()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Data Refresh Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `
            ## Data Refresh Workflow Failed

            **Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Date:** ${new Date().toISOString()}

            ### Actions requises
            1. Vérifier les logs du workflow
            2. Vérifier que les secrets sont configurés (FRED_API_KEY, SUPABASE_DB_URL)
            3. Vérifier la disponibilité de yfinance et FRED API

            ### Impact
            - Les modèles ML utiliseront les données existantes (cache 6h)
            - Pas de nouvelles prédictions jusqu'à résolution

            /label bug,urgent
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'data-pipeline']
            });
