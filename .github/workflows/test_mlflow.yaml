name: Test MLflow Connection

on:
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
  MLFLOW_MAX_RETRIES: "5"
  MLFLOW_RETRY_DELAY: "5"
  # Supabase (requis par api/config.py pour charger les données)
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  test-backtest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Réveil de MLflow (timeout 10min)
        run: |
          echo "⏳ Réveil du serveur MLflow (Render free tier)..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              -u "$MLFLOW_TRACKING_USERNAME:$MLFLOW_TRACKING_PASSWORD" \
              "$MLFLOW_TRACKING_URI/api/2.0/mlflow/experiments/get-by-name?experiment_name=Default" \
              2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "✅ MLflow prêt après $((i * 10))s"
              exit 0
            fi
            echo "  Tentative $i/60 — HTTP $STATUS, retry dans 10s..."
            sleep 10
          done
          echo "❌ MLflow pas disponible après 10min"
          exit 1

      - name: Run backtest
        run: |
          echo "🤖 Lancement du backtest de test..."
          python scripts/run_backtest.py
