name: Test MLflow Connection

on:
  workflow_dispatch: # Déclenchement manuel uniquement depuis l'onglet Actions

env:
  PYTHON_VERSION: '3.11'

jobs:
  test-backtest:
    name: Quick MLflow Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wake up MLflow on Render
        run: |
          echo "Réveil de MLflow..."
          curl -s "${{ secrets.MLFLOW_TRACKING_URI }}" > /dev/null
          sleep 75

      - name: Run backtest (Quick Test)
        run: |
          echo "🤖 Lancement du backtest de test..."
          python scripts/run_backtest.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}